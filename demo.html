     Nada aqui abre programa, toca música ou sai da página. -->
<style>
/* Identidade: preto 100% e azul Safira. Fontes do sistema por enquanto (empacotar Sora e DM Sans depois). */
:root {
  --z-a: #2F7BFF;
  --z-b: #AFD3FF;
  --z-acc: #3D8BFF;
  --z-acc2: #5FD7FF;
  --z-ink: #000000;
  --z-ink2: #0B0B0C;
  --z-ink3: #161617;
  --z-line: rgba(255, 255, 255, .08);
  --z-tx: #F5F6F8;
  --z-mu: #8C9097;
  --z-warn: #FFC857;
  --z-rose: #FF7A9C;
  --z-ok: #4ADE9B;
  --z-on: #04101F;
  --display: 'Sora', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
  --body: 'DM Sans', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--body); font-size: 14px; line-height: 1.4; color: var(--z-tx); background: transparent; -webkit-font-smoothing: antialiased; user-select: none; }
input, textarea, button { font: inherit; color: inherit; }
input, textarea { user-select: text; }
button { cursor: pointer; border: 0; background: none; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--z-acc); outline-offset: 2px; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }

/* ---------- componentes comuns ---------- */
.ic { width: 18px; height: 18px; flex: none; }
.hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hd h3 { font-family: var(--display); font-size: 22px; margin: 0; letter-spacing: -.01em; }
.hd p { margin: 2px 0 0; color: var(--z-mu); font-size: 13px; }
.ask { display: flex; align-items: center; gap: 8px; background: var(--z-ink2); border: 1px solid var(--z-line); border-radius: 999px; padding: 5px 5px 5px 16px; }
.ask input { flex: 1; background: none; border: 0; outline: 0; min-width: 0; }
.ask input::placeholder, .field::placeholder { color: var(--z-mu); }
.rb { width: 32px; height: 32px; border-radius: 50%; background: var(--z-ink3); display: grid; place-items: center; flex: none; }
.rb svg { width: 16px; height: 16px; }
.rb.acc { background: var(--z-acc); color: var(--z-on); }
/* "Sempre ouvindo" ligado: verde, como um microfone aberto */
.rb.continuo.on { background: var(--z-acc); color: var(--z-on); }
.rb:hover { filter: brightness(1.25); }
.card { background: var(--z-ink2); border: 1px solid var(--z-line); border-radius: 18px; padding: 14px; }
.bub { background: var(--z-ink3); border-radius: 14px; padding: 10px 12px; font-size: 13px; max-width: 92%; white-space: pre-line; user-select: text; cursor: text; }
.bub.me { background: color-mix(in srgb, var(--z-acc) 24%, var(--z-ink3)); align-self: flex-end; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { background: var(--z-ink2); border: 1px solid var(--z-line); border-radius: 16px; padding: 12px; text-align: left; }
.tile i { display: block; width: 22px; height: 22px; border-radius: 7px; margin-bottom: 10px; }
.tile b { font-family: var(--display); font-size: 20px; display: block; }
.tile span { font-size: 12px; color: var(--z-mu); }
.tile:hover { border-color: rgba(255, 255, 255, .18); }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 8px 16px; font-weight: 700; background: var(--z-ink3); }
.btn.acc { background: var(--z-acc); color: var(--z-on); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.btn.ghost { background: transparent; border: 1px solid var(--z-line); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn:not([disabled]):hover { filter: brightness(1.15); }
.field { background: var(--z-ink2); border: 1px solid var(--z-line); border-radius: 12px; padding: 9px 12px; outline: 0; min-width: 0; }
.field:focus { border-color: var(--z-acc); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--z-ink3); border-radius: 999px; padding: 6px 12px; font-weight: 500; font-size: 12.5px; }
.chip.on { background: color-mix(in srgb, var(--z-acc) 22%, var(--z-ink3)); color: var(--z-acc2); }
.chip:hover { filter: brightness(1.2); }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; background: var(--z-ink2); border: 1px solid var(--z-line); border-radius: 14px; padding: 10px 12px; }
.row .grow { flex: 1; min-width: 0; }
.row small { color: var(--z-mu); display: block; font-size: 12px; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #3a3d44; flex: none; display: grid; place-items: center; }
.check.on { background: var(--z-acc); border-color: var(--z-acc); color: var(--z-on); }
.check svg { width: 13px; height: 13px; }
.done { color: var(--z-mu); text-decoration: line-through; }
.bar { height: 6px; border-radius: 6px; background: var(--z-ink3); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--z-acc2); border-radius: 6px; }
.empty { color: var(--z-mu); padding: 18px 4px; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--z-ink3); color: var(--z-mu); }
.badge.ok { background: color-mix(in srgb, var(--z-ok) 18%, transparent); color: var(--z-ok); }
.badge.soon { background: color-mix(in srgb, var(--z-warn) 16%, transparent); color: var(--z-warn); }
.sw { width: 44px; height: 26px; border-radius: 26px; background: #2a2d33; position: relative; flex: none; transition: background .15s; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--z-acc); }
.sw[aria-checked="true"]::after { transform: translateX(18px); }
.seg { display: inline-flex; background: var(--z-ink3); border-radius: 999px; padding: 3px; }
.seg button { padding: 6px 14px; border-radius: 999px; color: var(--z-mu); font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--z-ink); color: var(--z-tx); box-shadow: 0 0 0 1px var(--z-line); }
.kbd { font-family: ui-monospace, 'Cascadia Mono', monospace; font-size: 12px; background: var(--z-ink3); border: 1px solid var(--z-line); border-radius: 7px; padding: 3px 8px; }
.gl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--z-mu); padding: 14px 4px 6px; }
.tleft { font-variant-numeric: tabular-nums; font-family: var(--display); font-weight: 700; }

/* ---------- painel rápido (entalho aberto) ---------- */
.quick { width: 100%; height: 100%; display: grid; grid-template-columns: 210px 1fr; background: var(--z-ink); border-radius: 26px; border: 1px solid var(--z-line); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(61, 139, 255, .14); }
.qside { padding: 16px 12px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--z-line); }
.who { display: flex; gap: 10px; align-items: center; padding: 0 6px 10px; }
.who b { font-family: var(--display); font-size: 16px; display: block; }
.who small { color: var(--z-acc2); font-size: 11px; display: block; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; color: var(--z-mu); font-weight: 500; white-space: nowrap; text-align: left; width: 100%; }
.nav:hover { background: var(--z-ink2); }
.nav.on { background: color-mix(in srgb, var(--z-acc) 18%, transparent); color: var(--z-acc); }
.nav em { margin-left: auto; font-style: normal; font-size: 11px; background: var(--z-ink3); color: var(--z-tx); border-radius: 999px; padding: 2px 8px; }
.spacer { flex: 1; }
.qmain { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; overflow: auto; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; min-height: 0; }
.chatbox { display: flex; flex-direction: column; gap: 8px; overflow: auto; }

/* ---------- janela de configurações ---------- */
.shell { display: grid; grid-template-columns: 68px 1fr; height: 100vh; background: var(--z-ink); }
.rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 46px 0 14px; border-right: 1px solid var(--z-line); }
.rail .logo { margin-bottom: 10px; }
.rb2 { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--z-mu); position: relative; }
.rb2 svg { width: 20px; height: 20px; }
.rb2:hover { background: var(--z-ink2); color: var(--z-tx); }
.rb2.on { background: color-mix(in srgb, var(--z-acc) 20%, transparent); color: var(--z-acc); }
.rb2.on::before { content: ''; position: absolute; left: -12px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--z-acc); }
.rsep { width: 26px; height: 1px; background: var(--z-line); margin: 8px 0; }
.page { overflow: auto; padding: 46px 40px 48px; }
.page-in { max-width: 1040px; display: flex; flex-direction: column; gap: 18px; }
.ph { display: flex; gap: 16px; align-items: center; }
.ph .tile-ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; background: var(--z-acc); }
.ph .tile-ic svg { width: 26px; height: 26px; }
.ph h2 { font-family: var(--display); font-size: 26px; margin: 0; letter-spacing: -.01em; }
.ph p { margin: 2px 0 0; color: var(--z-mu); }
.back { color: var(--z-mu); font-weight: 600; width: fit-content; display: flex; gap: 6px; align-items: center; }
.back:hover { color: var(--z-tx); }
.hero { display: grid; grid-template-columns: 1fr 250px; gap: 14px; }
.herocard { background: linear-gradient(120deg, color-mix(in srgb, var(--z-acc) 12%, var(--z-ink2)), var(--z-ink2) 70%); border: 1px solid var(--z-line); border-radius: 22px; padding: 22px; display: flex; gap: 22px; align-items: center; }
.herocard h4 { font-family: var(--display); font-size: 28px; margin: 0 0 4px; }
.herocard p { margin: 0 0 14px; color: var(--z-mu); }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.gcard { background: var(--z-ink2); border: 1px solid var(--z-line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; text-align: left; min-height: 118px; }
.gcard:not(.static):hover { border-color: rgba(255, 255, 255, .2); }
.gcard .badge, .opt .badge { align-self: flex-start; }
.gcard b { font-family: var(--display); font-size: 15px; display: block; }
.gcard small { color: var(--z-mu); font-size: 12.5px; }
.gi { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; }
.gi svg { width: 19px; height: 19px; }
.opt { background: var(--z-ink2); border: 1px solid var(--z-line); border-radius: 16px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.opt.on { border-color: var(--z-acc); background: color-mix(in srgb, var(--z-acc) 10%, var(--z-ink2)); }
.opt b { font-family: var(--display); font-size: 14px; }
.opt small { color: var(--z-mu); }
.setrow { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--z-line); }
.setrow:last-child { border-bottom: 0; }
.setrow .grow { flex: 1; min-width: 0; }
.setrow b { display: block; font-weight: 600; }
.setrow small { color: var(--z-mu); font-size: 12.5px; }
.group { background: var(--z-ink2); border: 1px solid var(--z-line); border-radius: 18px; overflow: hidden; }
.prog { color: var(--z-mu); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--z-line); }
.swatch.on { border-color: var(--z-ink); box-shadow: 0 0 0 2px var(--z-acc); }
.personal { display: grid; grid-template-columns: 300px 1fr; gap: 14px; }
.preview { background: radial-gradient(90% 80% at 50% 25%, color-mix(in srgb, var(--z-acc) 16%, var(--z-ink2)), var(--z-ink2)); border: 1px solid var(--z-line); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.avs { display: flex; flex-direction: column; gap: 6px; }
.avs time { color: var(--z-mu); font-size: 12px; }

/* paleta de busca (Ctrl+K) */
.pal-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; justify-content: center; padding-top: 14vh; z-index: 20; }
.pal { width: 520px; max-width: 92vw; height: fit-content; background: var(--z-ink2); border: 1px solid var(--z-line); border-radius: 18px; box-shadow: 0 30px 80px rgba(0, 0, 0, .7); overflow: hidden; }
.pal input { width: 100%; border: 0; border-bottom: 1px solid var(--z-line); background: none; padding: 16px 18px; outline: 0; font-size: 15px; }
.pal ul { list-style: none; margin: 0; padding: 6px; max-height: 320px; overflow: auto; }
.pal li { padding: 10px 12px; border-radius: 10px; display: flex; gap: 10px; align-items: center; color: var(--z-mu); }
.pal li.on { background: color-mix(in srgb, var(--z-acc) 18%, transparent); color: var(--z-tx); }
.pal li small { margin-left: auto; color: var(--z-mu); }

/* ---------- compactação do painel rápido (12 abas sem rolagem) + telas novas ---------- */
.quick { grid-template-columns: 188px 1fr; }
.qside { padding: 12px 9px; gap: 1px; }
.who { padding: 0 6px 8px; gap: 9px; }
.who b { font-size: 15px; }
.qside { position: relative; }
.qside .who { cursor: pointer; border-radius: 12px; }
/* "Fechar a Irys?" ao clicar no robozinho: um balãozinho de fala saindo dele, por cima (não empurra nada) */
.sair { position: absolute; z-index: 5; left: 56px; top: 4px; display: flex; align-items: center; gap: 7px; padding: 5px 9px; border-radius: 12px;
  background: var(--z-ink3); border: 1px solid var(--z-line); box-shadow: 0 6px 18px rgba(0, 0, 0, .5); font-size: 11.5px; color: var(--z-tx); white-space: nowrap; }
.sair::before { content: ''; position: absolute; left: -5px; top: 11px; width: 8px; height: 8px; background: var(--z-ink3);
  border-left: 1px solid var(--z-line); border-bottom: 1px solid var(--z-line); transform: rotate(45deg); }
.sair button { font-size: 11px; font-weight: 700; padding: 0 2px; color: var(--z-mu); }
.sair button[data-act="sair-sim"] { color: var(--z-rose); }
.sair button:hover { color: var(--z-tx); }
.nav { padding: 4px 9px; gap: 9px; font-size: 13px; border-radius: 10px; line-height: 1.25; }
.nav .ic { width: 16px; height: 16px; }
/* painel colado na borda superior (cantos de cima retos, de baixo arredondados) e lista de abas ocupando toda a altura */
.quick { border-radius: 0 0 26px 26px; border-top: 0; }
.qside .nav { flex: 1 1 0; min-height: 0; padding-block: 0; }
.qmain { padding: 14px 18px; gap: 9px; }
.qmain .hd h3 { font-size: 20px; }
.qmain .hd p { font-size: 12px; margin-top: 1px; }
.qmain .card { padding: 11px; border-radius: 16px; }
.qmain .ask { padding: 3px 3px 3px 14px; }
.qmain .rb { width: 28px; height: 28px; }
.qmain .tile { padding: 9px 11px; border-radius: 14px; }
.qmain .tile i { width: 16px; height: 16px; border-radius: 5px; margin-bottom: 6px; }
.qmain .tile b { font-size: 17px; }
.qmain .btn { padding: 6px 14px; }
.qmain .btn.sm { padding: 5px 11px; font-size: 12px; }
.qmain .chip { padding: 4px 10px; font-size: 12px; }
.qmain .two { gap: 9px; }
.qmain .bub { padding: 7px 10px; font-size: 12.5px; }
.row.sm { padding: 6px 10px; border-radius: 12px; gap: 10px; }
.row.sm .ic { width: 16px; height: 16px; }
.gi.sm { width: 30px; height: 30px; border-radius: 9px; }
.gi.sm svg { width: 16px; height: 16px; }
.mini { width: 58px; flex: none; text-align: center; background: var(--z-ink3); border: 0; border-radius: 999px; padding: 5px; color: var(--z-tx); outline: 0; }
.field.sm { padding: 5px 10px; border-radius: 999px; font-size: 12px; }
.scroll { overflow: auto; min-height: 0; flex: 1; }
.bub.dots { color: var(--z-mu); font-style: italic; }
.hint { color: var(--z-mu); font-size: 12px; margin: 0; }
.btnrow { display: inline-flex; gap: 6px; }
.okmsg { color: var(--z-ok); }

.graph { width: 100%; height: 100%; display: block; }
.empty-graph { flex: 1; min-height: 0; position: relative; padding: 0 !important; }
.empty-graph .mid { position: absolute; inset: 58% 0 0; text-align: center; color: var(--z-mu); font-size: 12.5px; }

.player { display: flex; gap: 14px; align-items: center; background: linear-gradient(150deg, color-mix(in srgb, var(--z-acc) 14%, var(--z-ink2)), var(--z-ink2)); }
.cover { width: 74px; height: 74px; border-radius: 16px; flex: none; display: grid; place-items: center; color: var(--z-on); background: linear-gradient(140deg, var(--z-acc), var(--z-acc2)); }
.cover svg { width: 32px; height: 32px; }
.ptitle { display: block; font-family: var(--display); font-size: 16px; }
.player small { color: var(--z-mu); }
.ctl { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.ctl .sp { flex: 1; }
.pbar { height: 4px; border-radius: 999px; background: var(--z-ink3); margin-top: 8px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--z-acc2); border-radius: 999px; }
.mini-player { display: flex; gap: 10px; align-items: center; }
.mini-player .cover { width: 34px; height: 34px; border-radius: 10px; }
.mini-player .cover svg { width: 16px; height: 16px; }
.mini-player .grow { min-width: 0; }
.mini-player .ctl { margin-top: 0; gap: 2px; }
.mini-player .ctl button.play { width: 28px; height: 28px; }
.mini-player .ctl button.play svg, .mini-player .ctl .rb svg { width: 14px; height: 14px; }
.play { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; }
.play svg { width: 18px; height: 18px; }

.clip { width: 100%; text-align: left; }
.clip:hover { border-color: rgba(255, 255, 255, .22); }

.verify { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 9px 12px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--z-acc) 40%, transparent); background: linear-gradient(120deg, color-mix(in srgb, var(--z-acc) 14%, var(--z-ink2)), var(--z-ink2)); }
.verify .grow { flex: 1; }
.verify b { display: block; }
.verify small { color: var(--z-mu); }
.stat { flex: none !important; }
.sl { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.sl span { color: var(--z-mu); }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; background: var(--z-ink2); border: 1px solid var(--z-line); font-size: 11.5px; color: var(--z-mu); }
.tool:hover { color: var(--z-tx); border-color: rgba(255, 255, 255, .22); }
.tool.warn { color: var(--z-warn); border-color: rgba(255, 200, 87, .5); }
.scanbox { display: flex; flex-direction: column; gap: 10px; }
.scanbox small { display: block; color: var(--z-mu); }
.scanbox .heavy { font-size: 12px; color: var(--z-mu); }
.scanbox .heavy b { color: var(--z-tx); font-weight: 600; }
.finding { background: var(--z-ink2); border-radius: 10px; padding: 9px 11px; align-items: center; }

/* ---------- Cérebro, Voz, Rotinas ---------- */
.prov { display: flex; flex-direction: column; gap: 10px; }
.provh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.provh small { display: block; color: var(--z-mu); margin-top: 3px; }
.errmsg { color: #ff8a8a; }
.dotst { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
.rot { display: flex; flex-direction: column; gap: 10px; }
.roth { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mu2 { color: var(--z-mu); font-size: 12.5px; }
.step { width: 22px; height: 22px; border-radius: 50%; background: var(--z-ink3); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.stepform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--z-ink3); border-radius: 14px; padding: 10px; }
select.field { appearance: none; padding-right: 22px; }
input[type=range] { accent-color: var(--z-acc); }

.chip .x { margin-left: 6px; color: var(--z-mu); font-size: 15px; line-height: 1; }
.chip .x:hover { color: var(--z-tx); }
.btn[disabled] { opacity: .45; cursor: default; }

.notas { margin: 6px 0 0; padding-left: 18px; color: var(--z-mu); }
.notas li { margin: 4px 0; }

/* ---------- capa de álbum de verdade, volume e barra clicável ---------- */
.cover { overflow: hidden; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

// Mascote da Irys: robozinho de cabeça azul, visor preto, orelhas que acendem e sensor no topo.
// Desenho próprio. svg(humor, tamanho, {a,b,eye,visor,shape,acc,antenna,dx,dy}) devolve o SVG como texto.
// shape muda o formato dos olhos neutros; dx/dy desloca os olhos (pra seguirem o mouse); 'ARCO' vira degradê arco-íris.
(function () {
  var uid = 0;

  function svg(kind, size, o) {
    o = o || {};
    var id = 'g' + (++uid);
    var defs = '';
    var A = o.a || 'var(--z-a)';
    var B = o.b || 'var(--z-b)';

    function rainbowGrad(gid, x1, y1, x2, y2) {
      var stops = RAINBOW.map(function (c, i) { return '<stop offset="' + (i / (RAINBOW.length - 1)) + '" stop-color="' + c + '"/>'; }).join('');
      return '<linearGradient id="' + gid + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" gradientUnits="userSpaceOnUse">' + stops + '</linearGradient>';
    }

  var SITES = { youtube: 'https://www.youtube.com', google: 'https://www.google.com', gmail: 'https://mail.google.com', instagram: 'https://www.instagram.com', 'whatsapp web': 'https://web.whatsapp.com', whatsapp: 'https://web.whatsapp.com', netflix: 'https://www.netflix.com', spotify: 'spotify:' };
  // programas que a Irys sabe fechar pelo nome (lista fixa, sem precisar de IA nem de agente). Peça pra adicionar mais.
  var CLOSE_APPS = { spotify: 'Spotify.exe', discord: 'Discord.exe', chrome: 'chrome.exe', word: 'WINWORD.EXE', excel: 'EXCEL.EXE', notepad: 'notepad.exe', steam: 'Steam.exe', vscode: 'Code.exe' };
  var FILLER_TRAIL = /\b(do desktop|da area de trabalho|na area de trabalho|por favor|pfv|por gentileza|de uma vez|ai|la|logo|agora)\b/g;
  // acha um atalho da área de trabalho pelo nome, tolerando enchimento, acento e nome parcial ("abre o whats" acha "WhatsApp")
  function findApp(pedido) {
    var g = Core.norm(String(pedido || '').replace(FILLER_TRAIL, ' ')).replace(/^(o |a |esse |essa |aquele |aquela )/, '').trim();
    if (!g || g.length < 2) return null;
    var lista = Core.apps || [];
    var exato = lista.find(function (n) { return Core.norm(n) === g; });
    if (exato) return exato;
    return lista.find(function (n) { var ng = Core.norm(n); return ng.indexOf(g) >= 0 || g.indexOf(ng) >= 0; }) || null;
  }

  Core.push = function (who, text) {
    Core.d.chat.push({ who: who, text: text, t: Date.now() });
    if (Core.d.chat.length > 60) Core.d.chat = Core.d.chat.slice(-60);
  };

  Core.summary = function () {
    var d = Core.d, s = Core.stats(), parts = [];
    var tasks = d.tasks.filter(function (x) { return !x.done; }).slice(0, 3).map(function (x) { return x.text; });
    parts.push(s.tasks ? 'Você tem ' + s.tasks + (s.tasks === 1 ? ' tarefa pendente' : ' tarefas pendentes') + ': ' + tasks.join('; ') + '.' : 'Nenhuma tarefa pendente.');
    var rems = d.reminders.filter(function (x) { return !x.done; }).sort(function (a, b) { return a.at - b.at; }).slice(0, 3);
    parts.push(rems.length ? 'Próximos lembretes: ' + rems.map(function (r) { return r.text + ' (' + Core.when(r.at) + ')'; }).join('; ') + '.' : 'Nenhum lembrete agendado.');
    parts.push('Hábitos de hoje: ' + s.habitsDone + ' de ' + s.habits + ' concluídos.');
    return parts.join(' ');
  };

  Core.pcReply = function (s) {

  };

  Core.runRoutine = function (r) {
    var d = Core.d, out = [], keys = {};

      else if (s.t === 'timer') { d.timers.push({ id: Core.uid(), name: s.name || 'Timer', end: Date.now() + (s.min || 1) * 60000, done: false }); keys.timers = 1; }

  };

  // números por extenso (o reconhecedor de voz escreve "dois", não "2"). Converte no texto normalizado.
  var UNITS = { zero: 0, um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12, treze: 13, catorze: 14, quatorze: 14, quinze: 15, dezesseis: 16, dezessete: 17, dezoito: 18, dezenove: 19 };
  var TENS = { vinte: 20, trinta: 30, quarenta: 40, cinquenta: 50, sessenta: 60, setenta: 70, oitenta: 80, noventa: 90 };
  Core.numWords = function (t) {
    t = t.replace(/\bmeia hora\b/g, '30 minutos').replace(/\buma hora e meia\b/g, '90 minutos').replace(/\bmeia\b/g, '30');
    var w = t.split(' '), out = [], i = 0;
    while (i < w.length) {
      var a = w[i], n = null, used = 1;
      if (TENS[a] !== undefined) {
        n = TENS[a];
        if (w[i + 1] === 'e' && UNITS[w[i + 2]] !== undefined && UNITS[w[i + 2]] > 0 && UNITS[w[i + 2]] < 10) { n += UNITS[w[i + 2]]; used = 3; }
      } else if (UNITS[a] !== undefined) { n = UNITS[a]; }
      // "um"/"uma" só viram número quando seguidos de unidade de tempo (evita mexer em "um timer", "uma tarefa")
      if (n !== null && (a === 'um' || a === 'uma') && !/^(minutos?|min|segundos?|seg|horas?|h|copos?)$/.test(w[i + 1] || '')) n = null;
      if (n !== null) { out.push(String(n)); i += used; } else { out.push(a); i++; }
    }
    return out.join(' ');
  };

  // tenta resolver sem IA. Devolve texto de resposta ou null.
  function local(text, t, keys) {
    var d = Core.d, m;
    // a voz costuma ouvir "timer" como "de" ou "taimer"; e escreve os números por extenso
    t = Core.numWords(t).replace(/\b(taimer|tai mer|temporizador|cronometro)\b/g, 'timer');
    t = t.replace(/^(?:me )?(?:coloca|bota|marca|inicia|inicie|faz|cria|liga|programa|quero|poe)\s+(?:um |uma )?(?=timer)/, '');
    t = t.replace(/^de (?=\d+\s*(?:segundos?|seg|minutos?|min|horas?|h)\b)/, 'timer de ');
    var tn = Core.norm(text);
    // devolve o trecho com a grafia original (acentos e maiúsculas), procurando no texto sem acentos, que tem o mesmo tamanho
    function orig(g) { var i = tn.length === text.length ? tn.indexOf(g) : -1; return i < 0 ? g : text.substr(i, g.length); }

    if (Core.pending) {
      var p = Core.pending; Core.pending = null;
      if (/^(sim|confirmo|pode|claro|isso|manda ver|bora)\b/.test(t)) return p.run();
      if (/^(nao|cancela|deixa|esquece|melhor nao)\b/.test(t)) return 'Tudo bem, cancelei.';
    }
    // rotinas pela frase
    for (var i = 0; i < d.routines.length; i++) {
      var r = d.routines[i], ph = Core.norm(r.phrase || '').trim();
      if (ph && (t === ph || t === 'modo ' + ph || t.replace(/^(ei |ola |oi )/, '') === ph)) return Core.runRoutine(r);
    }
    if ((m = t.match(/timer(?: de| para)? (\d+)\s*(segundos?|seg|s|minutos?|min|horas?|h)\b(?: (?:para|pra|de|do|da) (.+))?$/))) {
      var ms = parseInt(m[1], 10) * unit(m[2]);
      var nome = m[3] ? orig(m[3]).replace(/^(a|o|as|os|um|uma)\s+/i, '') : '';

    }
    if ((m = t.match(/(?:me lembra|lembre|lembrar)(?: de| que)? (.+?) (?:em|daqui a) (\d+)\s*(minutos?|min|horas?|h)\b/))) {

    if ((m = t.match(/(?:me lembra|lembre|lembrar)(?: de| que)? (.+?) as (\d{1,2})(?:(?::|h)(\d{2}))?\s*(?:h|horas?)?$/))) {

    }
    if (/(?:bebi|tomei)(?: um| 1| mais um)? (?:copo|agua)/.test(t)) {
      var h = d.habits.filter(function (x) { return x.id === 'agua'; })[0];
      if (h) { h.log[Core.today()] = (h.log[Core.today()] || 0) + 1; keys.push('habits'); return 'Anotado! ' + h.log[Core.today()] + ' de ' + h.goal + ' copos hoje.'; }
    }

    if ((m = t.match(/^(?:lembra que|lembre que|guarda que|guarde que|anota que|memoriza que|saiba que) (.+)/))) {
      d.memories.push({ id: Core.uid(), text: cap(orig(m[1])), t: Date.now() });
      keys.push('memories');
      return 'Guardei: “' + orig(m[1]) + '”.';
    }
    if (/(o que (?:voce )?(?:sabe|lembra) (?:sobre|de) mim|minhas memorias|o que voce guardou)/.test(t)) {
      return d.memories.length ? 'Eu sei que: ' + d.memories.slice(-8).map(function (x) { return x.text; }).join('; ') + '.' : 'Ainda não guardei nada sobre você. Diga “lembra que minha namorada se chama Ana”, por exemplo.';
    }
    if ((m = t.match(/^esquece(?: que)? (.+)/))) {
      var q = m[1], before = d.memories.length;
      d.memories = d.memories.filter(function (x) { return Core.norm(x.text).indexOf(q) < 0; });
      if (d.memories.length < before) { keys.push('memories'); return 'Pronto, esqueci.'; }
      return 'Não achei nada sobre isso na memória.';
    }
    // música
    if (/^(pausa|pausar|para a musica|pausa a musica|pausa o som)\b/.test(t)) { bridge.invoke('music:cmd', 'pause'); return 'Música pausada.'; }
    // "toca"/"play" sozinhos: comando de playback. "toca" seguido de algo mais específico cai no bloco de busca
    // de artista logo abaixo, por isso só esses dois ficam travados a bater a frase inteira.
    if (/^(toca|tocar|play|bota uma musica)$/.test(t) || /^(?:da play|dá play|de play|dar play|continua|retoma|toca uma musica|toca musica)\b/.test(t)) {
      return Core.tocar();
    }
    if (/(proxima(?: musica)?|passa a musica|pula a musica)/.test(t)) { bridge.invoke('music:cmd', 'next'); return 'Próxima.'; }
    if (/(musica anterior|volta a musica|anterior$)/.test(t)) { bridge.invoke('music:cmd', 'prev'); return 'Voltando.'; }

    if ((m = t.match(/^(toca|tocar|coloca|bota|poe|ouvir|pesquisa|pesquisar|procura|procurar|busca|buscar) (.+)/))) {

      if (!term) return Core.tocar(); // "toca a música"/"toca essa música": sem nome, só dá o play

      if (/^(pesquisa|pesquisar|procura|procurar|busca|buscar)$/.test(m[1])) {

        return 'Abri a busca por “' + term + '” no Spotify.';
      }

      }, function () { return 'Não consegui abrir o Spotify agora.'; });
    }
    // ferramentas e sites
    var tools = [[/(abre|abra|abrir) (?:a )?calculadora/, 'calc', 'Abrindo a calculadora.'], [/(abre|abra|abrir) (?:o )?(?:explorador|arquivos|meus arquivos)/, 'files', 'Abrindo seus arquivos.'],
      [/(captura|print) de tela|tira um print/, 'shot', 'Pode selecionar a área da captura.'], [/(mostra|mostrar|vai para) (?:a )?area de trabalho/, 'desktop', 'Pronto.'],

    for (var k = 0; k < tools.length; k++) if (tools[k][0].test(t)) { bridge.invoke('sys:tool', tools[k][1]); return tools[k][2]; }
    // tolera enchimento de linguagem entre o verbo e o nome do site: "abre a droga do spotify", "abre esse whatsapp logo"
    if ((m = t.match(/^(?:abre|abra|abrir|entra no|entre no|vai para o|vai pro)\b[\s\S]{0,24}?\b(youtube|google|gmail|instagram|whatsapp web|whatsapp|netflix|spotify)\b/))) {

      if (m[1] === 'spotify') {
        Core.spotifyAbertoEm = Date.now();

        if (/\b(play|toca|tocar|tocando|coloca musica|bota musica|solta o som)\b/.test(t.slice(m.index + m[0].length))) {

    if (/^(?:abre|abra|abrir|bota|poe|toca)\b.*\b(ele|ela|isso|essa|esse)\b/.test(t) && Core.lastSite) {
      bridge.invoke('sys:open', SITES[Core.lastSite]); return 'Abrindo ' + Core.lastSite + ' de novo.';
    }
    if ((m = t.match(/^(?:fecha|feche|fechar|encerra|encerrar|mata|matar)\b[\s\S]{0,24}?\b(spotify|discord|chrome|word|excel|notepad|steam|vscode)\b/))) {
      bridge.invoke('sys:close', CLOSE_APPS[m[1]]); return 'Fechando ' + m[1] + '.';
    }
    // qualquer outro programa: procura um atalho com esse nome na área de trabalho (sem precisar de IA nem de agente)
    if ((m = t.match(/^(?:abre|abra|abrir|entra no|entre no|executa|executar|inicia|iniciar)\s+(?:o |a )?(.+)/))) {
      var achadoAbrir = findApp(m[1]);
      if (achadoAbrir) { Core.lastSite = null; bridge.invoke('sys:openapp', achadoAbrir); return 'Abrindo ' + achadoAbrir + '.'; }
    }
    if ((m = t.match(/^(?:fecha|feche|fechar|encerra|encerrar|mata|matar)\s+(?:o |a )?(.+)/))) {

    }
    // ---------- gastos ----------

    if ((m = t.match(new RegExp('^(?:eu )?(?:gastei|paguei|desembolsei|torrei|registra(?:r)?(?: um)? gasto(?: de)?|anota(?:r)?(?: um)? gasto(?: de)?|novo gasto(?: de)?|gasto de)\\s+' + VALOR + '(?:\\s+(?:no|na|nos|nas|em|com|de|do|da|pra|para|pro|pela|pelo)\\s+(.+))?$')))) {
      var valor = valorDe(m[1]);
      if (valor > 0) {
        var desc = m[2] ? cap(orig(m[2]).replace(/[.!]+$/, '')) : 'Gasto';

    }

    if (/\bquanto (?:eu )?(?:ja )?gastei\b|\bquanto (?:foi|deu) (?:meu|o) gasto/.test(t)) {
      var per = periodoDe(t), alvo = null;
      var mc = t.match(/\b(?:com|em|no|na|de)\s+(.+)$/);
      if (mc && !/^(hoje|ontem|semana|esta semana|essa semana|mes|este mes|esse mes|o mes)$/.test(mc[1].trim())) {
        var achouCat = Core.CATEGORIAS.filter(function (c) { return Core.norm(c) === mc[1].trim(); })[0];
        alvo = achouCat || Core.categoriaDe(mc[1]);

      }
      var lista = Core.gastosDe(per, alvo);

    if (/^(?:meus gastos|resumo (?:dos|de) gastos|gastos (?:do|deste|desse) mes|me mostra (?:os )?(?:meus )?gastos|como estao (?:os )?meus gastos)/.test(t)) {

      var linhas = Core.porCategoria(lm).map(function (c) { return c[0] + ': ' + Core.reais(c[1]); }).join('; ');

    if (/^(?:(?:pode|ja pode|vai)\s+)?(?:se\s+)?deslig(?:a|ar|ue)(?:\s+(?:agora|ai|irys|iris|voce))?$/.test(t.replace(/[.,!?]/g, ' ').replace(/\s+/g, ' ').trim())) {
      setTimeout(function () { bridge.quit(); }, 300);
      return Core.SILENCIO;
    }
    // "meu PC tá muito lento, vê o que dá pra fazer": responde e abre o Meu PC já verificando (e para por aí)
    if (/\b(pc|computador|notebook)\b/.test(t) && /\b(lento|lenta|travando|pesado|pesada|devagar)\b/.test(t)) {
      bridge.invoke('quick:goto', { v: 'meupc', scan: true }).catch(function () { /* painel indisponível */ });

      return Core.refreshStats().then(Core.pcReply);
    }
    if (/(resumo do dia|o que (?:eu )?tenho (?:hoje|pra hoje)|minha agenda)/.test(t)) return Core.summary();
    if (/(previsao (?:do tempo)?|vai chover|vai fazer sol|como (?:esta|ta) o tempo|que tempo (?:faz|vai fazer)|tempo (?:hoje|agora)|clima (?:hoje|agora))\b/.test(t)) {
      bridge.invoke('weather:show').catch(function () { /* widget indisponível */ });
      return bridge.invoke('sys:weather').then(function (w) {
        if (!w || !w.ok) return 'Não consegui ver a previsão agora. Confira a internet.';
        var chuva = w.chuva >= 50 ? 'Boa chance de chuva, uns ' + w.chuva + '%.' : (w.chuva >= 20 ? 'Pouca chance de chuva, uns ' + w.chuva + '%.' : 'Sem previsão de chuva.');
        // formato pedido: "A previsão em BH é garoa Chefe, 23°C com sensação de 25°. Máxima de 26° e mínima de 18°. ... Ajudo em algo mais Chefe?"
        var nome = d.settings.userName ? ' ' + d.settings.userName : '';
        return 'A previsão ' + (w.cidade ? 'em ' + w.cidade : 'aqui') + ' é ' + w.desc.toLowerCase() + nome + ', ' + w.temp + '°C com sensação de ' + w.sensacao + '°. Máxima de ' + w.max + '° e mínima de ' + w.min + '°. ' + chuva + ' Ajudo em algo mais' + nome + '?';
      });
    }
    if (/que horas/.test(t)) return 'Agora são ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + '.';
    if (/que dia/.test(t)) return 'Hoje é ' + new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }) + '.';
    if (/^(oi|ola|e ai|bom dia|boa tarde|boa noite)\b/.test(t)) return 'Oi' + (d.settings.userName ? ', ' + d.settings.userName : '') + '! Como posso ajudar?';
    return null;
  }

  function systemPrompt() {
    var d = Core.d, s = d.settings, mem = d.memories.slice(-20).map(function (x) { return '- ' + x.text; }).join('\n');
    return 'Você é ' + Core.name() + ', uma assistente que mora no topo da tela do Windows' + (s.userName ? ' e conversa com ' + s.userName : '') + '. ' +
      'Responda sempre em português do Brasil, de forma simpática, direta e curta (no máximo 3 frases), sem markdown. ' +
      'Você é só texto: NUNCA afirme que abriu, fechou, instalou, cliclou ou executou algo no computador, mesmo que peçam com insistência ou xingamento — isso seria mentira, porque você não tem esse poder nesta conversa. ' +
      'Proibido dizer frases como "Abrindo X agora", "Pronto, abri", "Estou fazendo isso" ou qualquer variação. Se o pedido for um timer, lembrete, tarefa, música ou abrir algo, diga o comando exato que a pessoa pode digitar, por exemplo “timer de 10 minutos” ou “abre o spotify”. ' +
      'Se a pessoa insistir que quer uma ação de verdade no PC (abrir programas, mexer em arquivos, rodar comandos), explique que isso só funciona ligando o Claude Code ou o Codex em Configurações > Cérebro > Controlar o PC. ' +
      'Agora é ' + new Date().toLocaleString('pt-BR') + '.' + (mem ? '\nFatos que você sabe sobre o usuário:\n' + mem : '');
  }

  Core.speak = function (text) {
    var v = Core.d.settings.voice;
    if (v && v.speak) bridge.invoke('tts:speak', { text: text });
  };

  // Dá play na música. Se o Spotify acabou de ser aberto (ou nem está aberto), espera ele aparecer nos controles
  // de mídia do Windows e só então manda o play — antes, o play chegava antes do Spotify carregar e se perdia.
  Core.tocar = function () {
    var spotifyPronto = function () { var mu = Core.live.music || {}; return mu.ok && /spotify/i.test(mu.app || ''); };
    var tocando = function () { var mu = Core.live.music || {}; return mu.ok && /playing/i.test(mu.status || ''); };
    var recemAberto = Core.spotifyAbertoEm && Date.now() - Core.spotifyAbertoEm < 20000;
    var temPlayer = !!(Core.live.music || {}).ok;
    if (temPlayer && !(recemAberto && !spotifyPronto())) { bridge.invoke('music:cmd', 'play'); return 'Tocando.'; }
    if (!temPlayer && !recemAberto) { Core.spotifyAbertoEm = Date.now(); bridge.invoke('sys:open', SITES.spotify); }
    var inicio = Date.now();
    (function espera() {
      if (spotifyPronto()) {
        // o Spotify aparece um instante antes de aceitar comandos: dá play e confere; se não tocou, tenta de novo
        setTimeout(function () {
          bridge.invoke('music:cmd', 'play');
          setTimeout(function () { if (!tocando()) bridge.invoke('music:cmd', 'play'); }, 2500);
        }, 1200);
        return;
      }
      if (Date.now() - inicio < 25000) setTimeout(espera, 400);
      else bridge.invoke('music:cmd', 'play'); // não apareceu a tempo: manda o play mesmo assim (tecla de mídia)
    })();
    return temPlayer ? 'Tocando.' : 'Abrindo o Spotify e dando play.';
  };

  // Processa um pedido. Devolve uma Promise com a resposta. opts.speak = falar a resposta em voz alta.
  // toda resposta termina com o nome do usuário ("Pronto, já tá tocando Chefe."), a não ser que ela já tenha
  // chamado ele pelo nome em algum ponto da resposta ("Oi, Chefe! Como posso ajudar?" fica como está)
  Core.comNome = function (reply) {
    var nome = String((Core.d && Core.d.settings && Core.d.settings.userName) || '').trim();
    var r = String(reply == null ? '' : reply).trim();
    if (!nome || !r) return r;
    var esc = nome.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (new RegExp('(^|[^\\p{L}])' + esc + '($|[^\\p{L}])', 'iu').test(r)) return r;
    var m = r.match(/^([\s\S]*?)([.!?…]+)$/);
    return m ? m[1] + ' ' + nome + m[2] : r + ' ' + nome;
  };

  // tira o nome da assistente do começo do pedido ("Irys, abre o Spotify", "Ei Irys timer de 5 minutos").
  // Na voz isso já acontecia; escrevendo, o nome ia junto e o pedido caía no "modo simples".
  Core.semNome = function (text) {
    var nome = Core.norm(Core.name()).replace(/[^a-z0-9 ]/g, '').trim();
    if (!nome) return text;
    var formas = (nome === 'irys' || nome === 'iris') ? ['irys', 'iris'] : [nome];
    var tn = Core.norm(text); // Core.norm troca letra por letra, então as posições batem com o texto original
    for (var i = 0; i < formas.length; i++) {
      var m = tn.match(new RegExp('^(?:(?:ei|oi|ola|hey|fala)[\\s,!]+)?' + formas[i].replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=[\\s,!.:;?]|$)[\\s,!.:;?]*'));
      if (m) { var resto = text.slice(m[0].length).trim(); return resto || text; }
    }
    return text;
  };

  // ---------- gastos: guardar, separar por categoria e somar (pelo app ou pelo WhatsApp) ----------
  var CATEGORIAS = [
    ['Mercado', /\b(mercado|supermercado|feira|padaria|acougue|hortifruti|sacolao|atacadao|assai)\b/],
    ['Alimentação', /\b(almoco|jantar|lanche|restaurante|ifood|pizza|hamburguer|burger|cafe|comida|bar|marmita|delivery|sorvete|acai)\b/],
    ['Transporte', /\b(uber|99|taxi|gasolina|combustivel|onibus|metro|estacionamento|pedagio|posto|etanol|alcool|moto|carro|oficina|mecanico)\b/],
    ['Contas', /\b(luz|agua|internet|aluguel|condominio|telefone|celular|conta|boleto|energia|gas|iptu|ipva|fatura|cartao)\b/],
    ['Saúde', /\b(farmacia|remedio|medico|consulta|academia|dentista|exame|plano de saude|hospital|psicologo)\b/],
    ['Lazer', /\b(cinema|show|viagem|netflix|spotify|jogo|festa|passeio|assinatura|ingresso|hotel|balada)\b/],
    ['Compras', /\b(roupa|roupas|loja|shopping|presente|eletronico|amazon|mercado livre|shopee|tenis|sapato|magalu)\b/],
    ['Casa', /\b(casa|movel|moveis|reforma|material|limpeza|faxina|diarista)\b/]
  ];
  Core.CATEGORIAS = CATEGORIAS.map(function (c) { return c[0]; }).concat(['Outros']);
  Core.categoriaDe = function (desc) { var n = Core.norm(desc || ''); for (var i = 0; i < CATEGORIAS.length; i++) if (CATEGORIAS[i][1].test(n)) return CATEGORIAS[i][0]; return 'Outros'; };
  Core.reais = function (v) { return 'R$ ' + (Math.round(v * 100) / 100).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
  // período: 'hoje' | 'ontem' | 'semana' | 'mes' (padrão)
  Core.gastosDe = function (periodo, categoria) {
    var agora = new Date(), ini, fim = Infinity;
    var dia = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate()).getTime();
    if (periodo === 'hoje') ini = dia;
    else if (periodo === 'ontem') { ini = dia - 864e5; fim = dia; }
    else if (periodo === 'semana') { var dw = (agora.getDay() + 6) % 7; ini = dia - dw * 864e5; }
    else ini = new Date(agora.getFullYear(), agora.getMonth(), 1).getTime();
    return (Core.d.gastos || []).filter(function (g) { return g.t >= ini && g.t < fim && (!categoria || g.categoria === categoria); });
  };
  Core.somaGastos = function (lista) { return lista.reduce(function (a, g) { return a + g.valor; }, 0); };
  Core.porCategoria = function (lista) {
    var m = {}; lista.forEach(function (g) { m[g.categoria] = (m[g.categoria] || 0) + g.valor; });
    return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  };
  var NOME_PERIODO = { hoje: 'hoje', ontem: 'ontem', semana: 'nesta semana', mes: 'neste mês' };
  function periodoDe(t) { return /\bhoje\b/.test(t) ? 'hoje' : /\bontem\b/.test(t) ? 'ontem' : /\bsemana\b/.test(t) ? 'semana' : 'mes'; }
  function valorDe(s) { return parseFloat(String(s).replace(/\.(?=\d{3}\b)/g, '').replace(',', '.')); }

  Core.SILENCIO = '\u0000sem-resposta'; // resposta de um comando que não fala nem mostra nada

  Core.run = function (raw, opts) {
    var text = String(raw || '').trim();
    if (!text) return Promise.resolve(null);
    opts = opts || {};
    Core.push('me', text);
    text = Core.semNome(text); // "Irys, abre o Spotify" escrito: o nome na frente não faz parte do pedido
    var keys = ['chat'], t = Core.norm(text);
    // pedido composto ("dá play na música e abre o google"): só separa quando CADA pedaço começa com um verbo de
    // comando de verdade — assim nunca quebra um pedido de uma coisa só que por acaso tem "e" no meio
    // (ex. "toca Henrique e Juliano", onde "Juliano" sozinho não começa com verbo nenhum).
    var VERBO_CMD = /^(abre|abra|abrir|entra|entre|vai|fecha|feche|fechar|encerra|encerrar|mata|matar|executa|executar|inicia|iniciar|toca|tocar|play|d[aá]|dar|pausa|pausar|continua|retoma|bota|p[oõ]e|liga|desliga|cria|criar|anota|anotar|lembra|lembre|timer|aumenta|sobe|abaixa|diminui|baixa|muta|bloqueia|bloquear|trava)(?=\s|$)/i; // (\b não fecha depois de letra acentuada: "dá play" nunca era separado)
    var partes = text.split(/\s*(?:,|;| e )\s*/i).filter(Boolean);
    var composto = partes.length > 1 && partes.slice(1).every(function (p) { return VERBO_CMD.test(p); });
    var r = composto ? null : local(text, t, keys);
    if (composto) {
      var respostas = partes.map(function (p) { return local(p, Core.norm(p), keys); });
      if (respostas.every(function (x) { return x !== null; })) {
        r = Promise.all(respostas.map(function (x) { return Promise.resolve(x); })).then(function (xs) { return xs.join(' '); });
      } else {
        r = local(text, t, keys); // algum pedaço não é um comando de verdade: trata a frase inteira como uma coisa só
      }
    }
    function finish(reply, mood) {
      // comando que não responde nada (ex.: "se desliga"): não põe balão nem fala
      if (reply === Core.SILENCIO) { keys.forEach(function (k) { Core.save(k); }); Core.busy = false; Core.notify(); return ''; }
      reply = Core.comNome(reply);
      Core.push('bot', reply);
      keys.forEach(function (k) { Core.save(k); });
      Core.busy = false; Core.notify();
      if (opts.speak) Core.speak(reply);
      return reply;
    }
    if (r !== null) return Promise.resolve(r).then(function (x) { return finish(String(x)); });

    var brain = Core.d.settings.brain;
    if (!brain || brain === 'simple') {
      return Promise.resolve(finish('Ainda estou no modo simples: entendo timers, lembretes, tarefas, música e outros pedidos práticos. Para conversar livremente, ligue uma IA em Cérebro (IA).'));
    }
    if (brain === 'claude' || brain === 'codex') {
      // agente de PC: o pedido que não é um comando pronto vai para o Claude Code / Codex, que executa no computador
      Core.busy = true; Core.save('chat'); Core.notify();
      var ctx = Core.d.chat.filter(function (c) { return c.who === 'me' || c.who === 'bot'; }).slice(-7, -1).map(function (c) { return (c.who === 'me' ? 'Usuário: ' : 'Irys: ') + c.text; }).join(String.fromCharCode(10));
      return bridge.invoke('agent:run', { agent: brain, prompt: text, history: ctx }).then(function (res) {
        return finish(res.ok ? res.text : res.error);
      }, function () { return finish('Não consegui acionar o agente agora.'); });
    }
    // por voz (chamando o nome ou segurando Ctrl), nunca cai numa conversa de texto que não faz nada:
    // se não é um comando pronto e o cérebro é só bate-papo (não o agente de PC), avisa em vez de inventar.
    if (opts.voice && !opts.conversa) {
      return Promise.resolve(finish('Não entendi esse comando. Tente “abre o spotify”, “toca uma música”, “timer de 10 minutos” ou “qual a previsão do tempo”.'));
    }
    Core.busy = true; Core.save('chat'); Core.notify();
    var history = Core.d.chat.filter(function (c) { return c.who === 'me' || c.who === 'bot'; }).slice(-9, -1).map(function (c) { return { role: c.who === 'me' ? 'user' : 'assistant', content: c.text }; });
    var messages = [{ role: 'system', content: systemPrompt() }].concat(history, [{ role: 'user', content: text }]);
    return bridge.invoke('ai:chat', { provider: brain, messages: messages }).then(function (res) {
      return finish(res.ok ? res.text : res.error + ' Enquanto isso, ainda resolvo timers, lembretes, tarefas e música.');
    });
  };

  window.Core = Core;
})();

</script>
<script>
// Telas compartilhadas entre o painel rápido e a janela de configurações + tratamento dos cliques.
(function () {
  var C = Core, esc = C.esc, ic = C.ic;
  var V = {};

  function head(title, sub, extra) {
    return '<div class="hd"><div><h3>' + title + '</h3>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + (extra || '') + '</div>';
  }
  function ask(id, ph) {
    var vz = C.d && C.d.settings && C.d.settings.voice, cont = !!(vz && vz.continuo && vz.enabled);
    return '<div class="ask"><input id="' + id + '" data-enter="ask:' + id + '" placeholder="' + ph + '" autocomplete="off">' +
      '<button class="rb continuo' + (cont ? ' on' : '') + '" data-act="continuo" title="Sempre ouvindo' + (cont ? ' (ligado)' : '') + '">' + ic('ear') + '</button>' +
      '<button class="rb acc" data-act="ask" data-id="' + id + '" title="Enviar">' + ic('send') + '</button></div>';
  }
  function bubbles(list) {
    return list.map(function (b) { return '<div class="bub' + (b.who === 'me' ? ' me' : '') + '">' + esc(b.text) + '</div>'; }).join('');
  }
  function typing() { return C.busy ? '<div class="bub dots">pensando…</div>' : ''; }
  // barra de progresso da música (posMs/durMs vêm dos controles de mídia do Windows; nem todo player informa).
  // Dá pra clicar e arrastar: o mouse solto manda um "seek" pro player.
  function musicBar(m) {
    if (!m.durMs) return '';
    var pct = Math.max(0, Math.min(100, (m.posMs / m.durMs) * 100));
    return '<div class="pbar seek" title="Clique ou arraste para pular" data-pos="' + (m.posMs || 0) + '" data-dur="' + m.durMs + '" data-t0="' + Date.now() + '" data-playing="' + /playing/i.test(m.status || '') + '"><i style="width:' + pct + '%"></i></div>';
  }
  // capa de verdade quando o player informa (thumb em base64); senão, o ícone de música
  function cover(m, cls) {
    if (m && m.thumb) return '<div class="cover ' + (cls || '') + '"><img alt="" src="data:' + (m.thumbMime || 'image/jpeg') + ';base64,' + m.thumb + '"></div>';
    return '<div class="cover ' + (cls || '') + '">' + ic('music') + '</div>';
  }
  // card cheio do player: capa, título/artista, barra de progresso, prev/play/next e volume. Usado na aba Música
  // e também no Início — enquanto toca algo, ele toma o lugar inteiro do quadrado "Agora".
  function fullPlayer(m, extraClass) {
    var on = m && m.ok, playing = on && /playing/i.test(m.status || '');
    var temVol = on && typeof m.vol === 'number';
    var volRow = temVol ? '<div class="ctl volrow">' + iconBtn('music-cmd', m.muted ? 'mute' : 'voldown', m.muted ? 'Com som' : 'Silenciar', ' data-c="mute"') +
      '<input type="range" id="vol-slider" min="0" max="100" value="' + (m.muted ? 0 : m.vol) + '" data-vol="1" aria-label="Volume" style="flex:1">' +
      '<span class="mu2" style="min-width:34px;text-align:right">' + (m.muted ? 'mudo' : m.vol + '%') + '</span></div>' : '';
    return '<div class="card player' + (extraClass ? ' ' + extraClass : '') + '">' + cover(m, 'big') + '<div class="grow"><b class="ptitle">' + esc(on ? (m.title || 'Sem título') : 'Nenhuma música') + '</b><small>' + esc(on ? (m.artist || '') : 'Abra o Spotify ou qualquer player') + '</small>' + (on ? musicBar(m) : '') +
      '<div class="ctl">' + iconBtn('music-cmd', 'prev', 'Anterior', ' data-c="prev"') +
      '<button class="play" data-act="music-cmd" data-c="playpause" aria-label="' + (playing ? 'Pausar' : 'Tocar') + '">' + ic(playing ? 'pause' : 'play') + '</button>' +
      iconBtn('music-cmd', 'next', 'Próxima', ' data-c="next"') + '<span class="sp"></span>' +
      iconBtn('music-cmd', 'voldown', 'Volume menos', ' data-c="voldown"') + iconBtn('music-cmd', 'volup', 'Volume mais', ' data-c="volup"') + '</div>' + volRow + '</div></div>';
  }
  function iconBtn(act, icon, title, extra) { return '<button class="rb" data-act="' + act + '" title="' + title + '" aria-label="' + title + '"' + (extra || '') + '>' + ic(icon) + '</button>'; }

  // ----- Início do painel rápido -----
  V.inicio = function () {
    var d = C.d, s = C.stats(), name = d.settings.userName, last = d.chat.slice(-3), mu = C.live.music;
    var agenda = [];
    d.timers.filter(function (t) { return !t.done; }).slice(0, 2).forEach(function (t) {
      agenda.push('<div class="row sm">' + ic('timer') + '<div class="grow">' + esc(t.name) + '</div><span class="tleft" data-end="' + t.end + '">' + C.left(t.end) + '</span></div>');
    });
    d.reminders.filter(function (r) { return !r.done; }).sort(function (a, b) { return a.at - b.at; }).slice(0, 3 - agenda.length).forEach(function (r) {
      agenda.push('<div class="row sm">' + ic('bell') + '<div class="grow">' + esc(r.text) + '<small>' + C.when(r.at) + '</small></div></div>');
    });
    // tocando alguma coisa: o quadrado inteiro vira o player, bem mais completo que só um texto
    var cardAgora = mu.ok ? fullPlayer(mu, 'big-square')
      : agenda.length ? '<div class="card"><div class="gl" style="padding-top:0">Agora</div><div class="list">' + agenda.join('') + '</div></div>'
      : '<div class="card"></div>'; // sem música e sem nada agendado: quadro em branco, igual ao da conversa
    return head(C.saudacao() + (name ? ', ' + esc(name) : '') + '!', 'Estou à disposição pra atender qualquer pedido.') +
      ask('ask-q', 'Ex: qual a previsão do tempo hoje?') +
      '<div class="two"><div class="card chatbox golink" data-act="nav" data-v="conversa" title="Abrir a conversa">' + (last.length ? bubbles(last) : '') + typing() + '</div>' +
      cardAgora + '</div>' +
      '<div class="tiles">' +
      '<button class="tile" data-act="nav" data-v="lembretes"><i style="background:#7C9CFF"></i><b>' + s.reminders + '</b><span>lembretes</span></button>' +
      '<button class="tile" data-act="nav" data-v="tarefas"><i style="background:var(--z-acc)"></i><b>' + s.tasks + '</b><span>tarefas</span></button>' +
      '<button class="tile" data-act="nav" data-v="habitos"><i style="background:var(--z-acc2)"></i><b>' + s.habitsDone + '/' + s.habits + '</b><span>hábitos hoje</span></button>' +
      '<button class="tile" data-act="nav" data-v="timers"><i style="background:#38BDF8"></i><b>' + s.timers + '</b><span>timers</span></button></div>';
  };

  V.conversa = function () {
    var d = C.d;
    var agente = d.settings.brain === 'claude' || d.settings.brain === 'codex';
    var sub = d.settings.brain === 'simple' ? 'Modo simples. Ligue uma IA em Cérebro para conversar livremente.'
      : agente ? 'Ligada ao ' + (d.settings.brain === 'claude' ? 'Claude Code' : 'Codex') + ': ela pede, ele executa de verdade no seu PC.'
      : 'Conversando com a IA ' + esc(d.settings.brain) + ' — só texto, não abre nem executa nada no PC.';
    return head('Conversa', sub, '<button class="btn sm ghost" data-act="clear-chat">Limpar</button>') +
      '<div class="card chatbox" id="chatbox" style="flex:1;min-height:120px">' + (d.chat.length ? bubbles(d.chat) : '') + typing() + '</div>' +
      ask('ask-c', 'Escreva para a ' + esc(C.name()) + '…');
  };

  // ----- Memória: grafo + lista -----
  V.memoria = function () {
    var all = C.d.memories, q = C.norm(C.ui.memQ || '');
    var list = all.filter(function (m) { return !q || C.norm(m.text).indexOf(q) >= 0; });
    var body;
    if (C.ui.memList) {
      body = '<div class="card" style="flex:1;min-height:0;overflow:auto"><div class="list">' + (list.map(function (m) {

  var Views = { V: V, head: head, ask: ask, setPath: setPath, stepText: stepText };

  Views.bind = function (root, onChange, extra) {

      switch (name) {

      if (h !== st.hover) { st.hover = h; c.style.cursor = h ? 'grab' : 'default'; anima(); }
    });
    function solta() {
      if (!st.arr) return;
      if (st.arr && st.arr.no) { st.arr.no.fx = st.arr.no.fy = null; st.alpha = Math.max(st.alpha, 0.3); }
      st.arr = null; c.style.cursor = st.hover ? 'grab' : 'default'; anima();
    }
    window.addEventListener('pointerup', solta);
    window.addEventListener('pointercancel', solta);
    c.addEventListener('pointerleave', function () { if (!st.arr && st.hover) { st.hover = null; anima(); } });
    c.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r = c.getBoundingClientRect(), v = st.view, k2 = Math.min(3, Math.max(0.35, v.k * Math.exp(-e.deltaY * 0.0015)));
      var mx = e.clientX - r.left - r.width / 2, my = e.clientY - r.top - r.height / 2;
      v.x = mx - (mx - v.x) * (k2 / v.k); v.y = my - (my - v.y) * (k2 / v.k); v.k = k2;
      st.ajustou = true; anima();
    }, { passive: false });
    c.addEventListener('dblclick', function (e) { if (!acha(mundo(e))) { ajusta(); st.alpha = Math.max(st.alpha, 0.4); anima(); } });
  }

  function tamanho() {
    var c = st.canvas; if (!c) return;
    var r = c.getBoundingClientRect(); st.dpr = window.devicePixelRatio || 1;
    var w = Math.max(1, Math.round(r.width * st.dpr)), h = Math.max(1, Math.round(r.height * st.dpr));
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; anima(); }
  }

  // procura o canvas depois de cada redesenho da tela. A tela é redesenhada várias vezes (a música atualiza
  // a cada segundo): em vez de usar o canvas novo, recoloca o MESMO canvas no lugar, sem piscar nem perder o arrasto.
  function conecta() {
    var c = document.querySelector('canvas.mgraph');
    if (!c) return;
    if (!st.canvas) {
      st.canvas = c; st.ctx = c.getContext('2d');
      liga(c);
      st.ro = new ResizeObserver(tamanho); st.ro.observe(c);
    } else if (c !== st.canvas) c.replaceWith(st.canvas);
    else return sincroniza();
    tamanho();
    sincroniza();
    desenha(); // desenha já, antes da tela aparecer (sem quadro vazio)
    anima();
  }
  new MutationObserver(conecta).observe(document.documentElement, { childList: true, subtree: true });
  window.Grafo = { categoria: categoria, reajusta: function () { st.ajustou = false; st.alpha = 1; anima(); } };
})();

</script>
<script>
// Painel rápido: abre ao passar o mouse no entalho. As 12 abas e atalho para o painel completo.
(function () {
  var NAV = [['inicio', 'home', 'Início'], ['conversa', 'chat', 'Conversa'], ['memoria', 'nodes', 'Memória'], ['tarefas', 'list', 'Tarefas'], ['lembretes', 'bell', 'Lembretes'], ['gastos', 'wallet', 'Gastos'],
    ['habitos', 'drop', 'Hábitos'], ['timers', 'timer', 'Timers'], ['musica', 'music', 'Música'], ['copiados', 'clip', 'Copiados'], ['rotinas', 'bolt', 'Rotinas'],
    ['meupc', 'monitor', 'Meu PC'], ['@settings', 'sliders', 'Configurações']];
  var view = 'inicio';
  var mood = 'repouso';
  var moodT = null;
  var ouvindo = false;
  var perguntandoSair = false;
  // "Sempre ouvindo" ligado (botão da orelhinha): o status fica "te ouvindo", igual aos outros dois modos de voz
  function sempreOuvindo() { var v = Core.d && Core.d.settings && Core.d.settings.voice; return !!(v && v.enabled && v.continuo); } // clicou no robozinho: mostra "Fechar a Irys? Fechar / Não" // segurando a tecla de falar (ou chamou pelo nome): mostra "te ouvindo" no lugar de "as ordens"
  var qs = document.getElementById('qs');
  var qm = document.getElementById('qm');

  function count(id) {
    var s = Core.stats();
    var n = id === 'tarefas' ? s.tasks : id === 'lembretes' ? s.reminders : id === 'timers' ? s.timers : 0;
    if (id === 'habitos') return '<em>' + s.habitsDone + '/' + s.habits + '</em>';
    return n ? '<em>' + n + '</em>' : '';
  }

  function render() {
    Views.keepFocus(function () {
      // clicar no robozinho pergunta se quer fechar a Irys
      qs.innerHTML = '<div class="who" data-act="sair-perguntar" title="Fechar a ' + Core.esc(Core.name()) + '">' + Core.face(mood, 38) + '<div><b>' + Core.esc(Core.name()) + '</b><small>● ' + (ouvindo || sempreOuvindo() ? 'te ouvindo' : (Core.busy ? 'pensando' : 'as ordens')) + '</small></div></div>' +
        (perguntandoSair ? '<div class="sair">Fechar?<button data-act="sair-sim">Sim</button><button data-act="sair-nao">Não</button></div>' : '') +
        NAV.map(function (n) { return '<button class="nav' + (n[0] === view ? ' on' : '') + '" data-act="nav" data-v="' + n[0] + '">' + Core.ic(n[1]) + n[2] + count(n[0]) + '</button>'; }).join('');
      qm.innerHTML = Views.V[view]();
      var cb = document.getElementById('chatbox');
      if (cb) cb.scrollTop = cb.scrollHeight;
    });
  }

  function extra(name, ds) {
    if (name === 'sair-perguntar') { perguntandoSair = !perguntandoSair; return true; }
    if (name === 'sair-nao') { perguntandoSair = false; return true; }
    if (name === 'sair-sim') { bridge.quit(); return false; }
    if (name === 'nav') {
      if (ds.v === '@settings') { bridge.openSettings(); return false; }
      view = ds.v;
      if (view === 'meupc') Core.refreshStats().then(render);
      return true;
    }
    return false;
  }

  Core.init().then(function () {
    Views.bind(document.getElementById('q'), render, extra);
    Core.onChange(render);
    render();
    setInterval(Views.tick, 1000);
    setInterval(function () { if (view === 'meupc' && !Core.ui.scanning) Core.refreshStats().then(render); }, 2500);

    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') bridge.hideQuick(); });

    // abrir/fechar: a janela nunca some; a forma cresce de dentro da pílula e encolhe de volta
    var shape = document.getElementById('shape');
    shape.style.setProperty('--qw', Core.cfg.QUICK.w + 'px');
    shape.style.setProperty('--qh', Core.cfg.QUICK.h + 'px');
    var aberto = false, someT = null, saiT = null;
    bridge.on('quick:expand', function (p) {
      clearTimeout(someT); clearTimeout(saiT); saiT = null;
      if (p && p.pw) shape.style.setProperty('--pw', p.pw + 'px');
      if (p && p.ph) shape.style.setProperty('--ph', p.ph + 'px');
      // de onde a forma nasce: o centro da pílula (que pode ter sido arrastada pro lado)
      if (p && p.px != null) shape.style.setProperty('--px', p.px + 'px'); else shape.style.removeProperty('--px');
      aberto = true;
      render();
      shape.classList.add('vis');
      // dois quadros: garante que a forma já foi desenhada no tamanho da pílula antes de começar a crescer
      requestAnimationFrame(function () { requestAnimationFrame(function () { if (aberto) shape.classList.add('open'); }); });
    });
    bridge.on('quick:collapse', function () {
      if (perguntandoSair) { perguntandoSair = false; render(); }
      aberto = false; clearTimeout(saiT); saiT = null;
      var ae = document.activeElement; if (ae && ae.blur) ae.blur();
      shape.classList.remove('open');
      clearTimeout(someT);
      someT = setTimeout(function () { if (!aberto) shape.classList.remove('vis'); }, 420);
    });
    // o mouse saiu do painel: fecha depois de um instante (voltando a tempo, nada acontece)
    function sai() { if (aberto && !saiT) saiT = setTimeout(function () { saiT = null; if (aberto) bridge.leaveQuick(); }, 400); }
    function fica() { clearTimeout(saiT); saiT = null; }
    document.addEventListener('mousemove', function (e) {
      if (!aberto) return;
      var r = shape.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) fica(); else sai();
    });
    document.addEventListener('mouseleave', sai);

    // segurar no topo do painel (cabeçalho) e arrastar pro lado: o painel e o entalho andam juntos, como uma janela
    var arr = null;
    shape.addEventListener('pointerdown', function (e) {
      if (!aberto || e.button !== 0) return;
      var r = shape.getBoundingClientRect();
      if (e.clientY - r.top > 56 || (e.target.closest && e.target.closest('button, input, textarea, select, a, [data-act], .seek, .bub, canvas'))) return;
      arr = { sx: e.screenX, ativo: false };
      shape.setPointerCapture(e.pointerId);
    });
    shape.addEventListener('pointermove', function (e) {
      if (!arr) return;
      if (!arr.ativo && Math.abs(e.screenX - arr.sx) > 5) { arr.ativo = true; shape.classList.add('arr'); bridge.dragPill('start', arr.sx); }
      if (arr.ativo) bridge.dragPill('move', e.screenX);
    });
    function soltaArr() { if (arr && arr.ativo) bridge.dragPill('end'); arr = null; shape.classList.remove('arr'); }
    shape.addEventListener('pointerup', soltaArr);
    shape.addEventListener('pointercancel', soltaArr);

    // abrir numa tela específica (vem do processo principal). scan: já começa a verificação do Meu PC
    bridge.on('goto', function (p) {
      if (!p || !p.v) return;
      view = p.v;
      if (p.scan) {
        Core.ui.scanning = true; Core.ui.scanProg = null; Core.ui.cleaned = ''; Core.ui.confirmClean = false; Core.ui.pcFechados = [];
        bridge.invoke('sys:scan').then(function (r) { Core.ui.scan = r; Core.ui.scanning = false; Core.ui.scanProg = null; render(); }).catch(function () { Core.ui.scanning = false; render(); });
      }
      if (view === 'meupc') Core.refreshStats().then(render);
      render();
    });

    bridge.on('focus-input', function () {
      var el = document.querySelector('.qmain input');
      if (el) el.focus();
    });
    bridge.on('voice:state', function (v) {
      var novo = !!v && (v.state === 'ouvindo' || v.state === 'ensinando');
      if (novo !== ouvindo) { ouvindo = novo; render(); }
    });
    bridge.on('alert', function () {
      clearTimeout(moodT);
      mood = 'conseguiu';
      render();
      moodT = setTimeout(function () { mood = 'repouso'; render(); }, 4000);
    });
  });
})();

</script>
<script>
/* ---------- pílula e abrir/fechar, como no app ---------- */
(function () {
  var screen = document.getElementById('screen'), pill = document.getElementById('pill'), shape = document.getElementById('shape');
  var m = document.getElementById('m'), txt = document.getElementById('txt'), mu = document.getElementById('mu'), mt = document.getElementById('mt'), ma = document.getElementById('ma');
  var touch = window.matchMedia('(hover:none)').matches;
  function open(v) {
    if (v === screen.classList.contains('open')) return;
    screen.classList.toggle('open', v);
    if (v) demoEmit('quick:expand', { pw: pill.offsetWidth, ph: 34 }); else demoEmit('quick:collapse'); pill.setAttribute('aria-expanded', v); try { parent.postMessage({ irysDemo: v ? 'aberto' : 'fechado' }, '*'); } catch (e) {} }
  window.demoOpen = open;
  pill.addEventListener('mouseenter', function () { if (!touch) open(true); });
  pill.addEventListener('click', function () { open(true); });
  pill.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(true); } });
  // toque fora do painel fecha (celular)
  screen.addEventListener('pointerdown', function (e) { if (screen.classList.contains('open') && !shape.contains(e.target) && !pill.contains(e.target)) open(false); });
  function tick() {
    if (!window.Core || !Core.d) return;
    var live = Core.d.timers.filter(function (t) { return !t.done && t.end > Date.now(); }).sort(function (a, b) { return a.end - b.end; });
    var mz = Core.live.music || {}, tocando = mz.ok && /playing/i.test(mz.status || '');
    m.innerHTML = Core.face(Core.busy ? 'pensando' : (live.length ? 'pensando' : 'repouso'), 24);
    txt.textContent = live.length ? Core.left(live[0].end) : '';
    mu.hidden = !tocando || !!live.length; pill.classList.toggle('still', !tocando);
    if (tocando) { mt.textContent = mz.title || ''; ma.textContent = mz.artist || ''; }
  }
  setInterval(tick, 500); setTimeout(tick, 50);
  // pedidos vindos dos botões da página de vendas
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.irysAsk && window.Core && Core.d) { open(true); Core.run(String(d.irysAsk)); }
    if (d.irysOpen !== undefined) open(!!d.irysOpen);
  });
})();
</script>
